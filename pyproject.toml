[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frame-extractor"
version = "0.1.0"
description = "영상에서 PNG 프레임을 추출하는 웹 어드민 도구"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/frame_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
